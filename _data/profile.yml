  - title: "Internship: Dynamic mechanical characterization of elementary fibres for bio-sourced composites"
    org: FEMTO-ST Institute, UMR CNRS 6174, Applied Mechanics Department
    logo: assets/images/badges/femto.svg
    url: "https://www.femto-st.fr/fr"
    kind: work
    start: 2024
    end: 2024
    points:
      - Dynamic testing (laser vibrometer, high-speed camera, vacuum pump) on flax fibres
      - Damping identified by logarithmic decrement; storage (stiffness) modulus via COMSOL
  - title: "Internship: Multi-physics optomechanical sensor study"
    org: CEA-Leti, Université Grenoble Alpes
    logo: assets/images/badges/leti.webp
    url: "https://www.leti-cea.fr/"
    kind: work
    start: 2025
    end: 2025
    points:
      - Gas sensing with optomechanical chips and a Mach&ndash;Zehnder reference
      - Experimental bench, capping encapsulation (PMMA + tape), RF probe measurements
      - Comsol/RSoft simulations of the optomechanical coupling and eigenmodes
  - title: "PhD: Sustainable architected metamaterials for elastic wave manipulation"
    org: "Institut Jean Lamour, UMR CNRS 7198, N2EV department, Metamaterials and Phononics group · C2MP Doctoral School"
    place: Nancy, France
    logo: assets/images/badges/ijl.webp
    url: "https://ijl.univ-lorraine.fr/"
    kind: work
    start: 2025
    end: present
    until: 2028
    points:
      - Design of 3D piezoelectric metamaterials from pillar-based unit cells, with a piezoelectric tensor tunable through the micro-architecture
      - "Elastodynamic characterization: band structures, Willis coupling, electro-momentum coupling"
      - Machine learning (GNN, inverse design) to speed up prediction and optimization of wave-propagation properties
      - "Applications: defect/impact detection, directional sensing, energy harvesting, non-Hermitian behaviour"

