<!DOCTYPE html>
<html lang="en" class="lang-active-en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="google-site-verification" content="m5sSh23hfBna8Z26FSpuF8CZbxXyIUevnB4gykymYvo">
    <title>{{ page.navbar_name | default: page.title }} - {{ site.data.profile.navbar_name }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Nicolas Cayuela, PhD student at Institut Jean Lamour (Nancy, UMR CNRS 7198). Research on elastic metamaterials, phononic crystals and graph deep learning (GNN) for inverse design.{% endif %}">
    <link rel="canonical" href="https://nicolascayuela.github.io{{ page.url | replace: 'index.html', '' }}">
    <meta property="og:title" content="{{ page.navbar_name | default: page.title }} - Nicolas Cayuela">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}PhD student in phononics and metamaterials at Institut Jean Lamour - elastic metamaterials, phononic crystals, GNN inverse design.{% endif %}">
    <meta property="og:url" content="https://nicolascayuela.github.io{{ page.url | replace: 'index.html', '' }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://nicolascayuela.github.io/assets/images/photos/profile.jpg">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="fr_FR">

    <!-- Structured data: consolidates the "person" entity for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Nicolas Cayuela",
      "url": "https://nicolascayuela.github.io/",
      "jobTitle": "PhD Student in Phononics & Metamaterials",
      "affiliation": {
        "@type": "Organization",
        "name": "Institut Jean Lamour, UMR CNRS 7198",
        "url": "https://ijl.univ-lorraine.fr/"
      },
      "knowsAbout": ["Phononics", "Elastic metamaterials", "Phononic crystals",
                     "Machine learning", "Graph neural networks", "Inverse design"],
      "sameAs": [
        "https://github.com/{{ site.data.profile.github }}",
        "https://www.linkedin.com/in/{{ site.data.profile.linkedin }}"
      ]
    }
    </script>

    <script>
        (function() {
            var lang = 'en';   // site is English-only; drop any stale FR choice
            try { localStorage.removeItem('site-lang'); } catch (e) {}
            var html = document.documentElement;
            html.className = html.className.replace(/lang-active-\w+/g, '').trim();
            html.classList.add('lang-active-' + lang);
            html.setAttribute('lang', lang === 'fr' ? 'fr' : 'en');
            // dark theme is the default; light only if explicitly chosen
            if (localStorage.getItem('site-theme') !== 'light') {
                html.classList.add('theme-dark');
            }
        })();
    </script>

    <!-- Stylesheets: one same-origin file (fonts + purged Bootstrap + icons + site CSS) -->
    <link rel="preload" href="{{ '/assets/fonts/lato-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=2">
    <!-- ICON -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/etc/favicon-32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="128x128" href="{{ '/assets/images/etc/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/etc/favicon.png' | relative_url }}">

    <!-- Quote CSS-->
    <style>
        blockquote {
            font-style: italic;
            color: #555;
            border-left: 10px solid #3498db;
            background: #ecf5fc;
            padding: 15px 20px;
            margin: 20px 0;
            max-width: 920px;
            width: 100%;
            position: relative;
            quotes: "“" "”" "‘" "’";
        }
        blockquote:before {
            color: #3498db;
            content: open-quote;
            font-size: 2em;
            position: absolute;
            left: 10px;
            top: 10px;
        }
        blockquote:after {
            color: #3498db;
            content: close-quote;
            font-size: 2em;
            position: absolute;
            right: 10px;
            bottom: 10px;
        }
    </style>
    <!-- Shared mobile-viewport test (single source of truth for the phone breakpoint).
         Defined in <head> so it's available to body/footer scripts on every page. -->
    <script>
        window.isMobileViewport = function () {
            return !!(window.matchMedia &&
                window.matchMedia("(max-width: 820px), (pointer: coarse)").matches);
        };
    </script>
</head>

<body class="bg-light" {{ page.body_attr }}>
    {% include navbar.html %}
    <div class="container">
        {{content}}
    </div>
    {% include footer.html %}

    <!-- Scripts -->
    <script src="{{ '/assets/js/common.js' | relative_url }}?v=3" defer></script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v=2" defer></script>

    <!-- Elastic-wave metamaterial background on every page (bump ?v= to bust cache) -->
    <script src="{{ '/assets/js/wave-particles.js' | relative_url }}?v=v8" defer></script>

    {% if page.mathjax %}
    <!-- MathJax: only loaded on pages that opt in via `mathjax: true` front matter -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" async></script>
    {% endif %}
</body>
</html>
